<!doctype html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YT Veille{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="h-full bg-slate-100 text-slate-800">
<div class="min-h-full flex flex-col">
  <header class="bg-slate-900 text-white">
    <div class="mx-auto max-w-7xl px-4 py-3 flex items-center gap-6">
      <a href="/" class="font-bold text-lg tracking-tight">📺 YT Veille</a>
      <nav class="flex gap-1 text-sm">
        <a href="/" class="px-3 py-1.5 rounded hover:bg-slate-700 {% if request.url.path == '/' %}bg-slate-700{% endif %}">Tableau de bord</a>
        <a href="/domains" class="px-3 py-1.5 rounded hover:bg-slate-700 {% if request.url.path.startswith('/domains') %}bg-slate-700{% endif %}">Domaines</a>
        <a href="/reports" class="px-3 py-1.5 rounded hover:bg-slate-700 {% if request.url.path.startswith('/reports') %}bg-slate-700{% endif %}">Rapports</a>
        <a href="/docs" class="px-3 py-1.5 rounded hover:bg-slate-700">API</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl w-full px-4 py-8 flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-xs text-slate-400 py-4">
    YT Veille · POC · données via YouTube Data API v3
  </footer>
</div>
</body>
</html>
