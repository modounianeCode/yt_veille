{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}{{ name }} · YT Veille{% endblock %}
{% block content %}

<nav class="no-print mb-4 flex flex-wrap items-center justify-between gap-3" aria-label="Actions du rapport">
  {{ m.crumb('/reports', 'Tous les rapports') }}
  <div class="flex items-center gap-2">
    <span class="hidden font-mono text-xs text-slate-400 sm:inline">{{ slug }} / {{ name }}</span>
    <button type="button" onclick="window.print()"
            class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-600 shadow-sm transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/40">
      {{ m.icon('print', 'h-4 w-4') }} Imprimer
    </button>
    <a href="/domains/{{ slug }}"
       class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-600 shadow-sm transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/40">
      {{ m.icon('layers', 'h-4 w-4') }} Voir le domaine
    </a>
  </div>
</nav>

<article class="prose prose-slate max-w-none rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-9
                prose-headings:tracking-tight prose-h1:text-2xl prose-h2:text-lg
                prose-table:text-sm prose-th:bg-slate-50 prose-th:px-3 prose-th:py-2
                prose-td:px-3 prose-td:py-2 prose-th:text-xs prose-th:uppercase prose-th:tracking-wide
                prose-a:font-medium prose-a:text-brand-600 prose-a:no-underline hover:prose-a:underline">
  {{ content | safe }}
</article>

{% endblock %}
