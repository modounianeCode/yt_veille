{% extends "base.html" %}
{% block title %}{{ name }} · YT Veille{% endblock %}
{% block content %}

<div class="mb-4 flex items-center justify-between gap-3">
  <a href="/reports" class="text-sm font-medium text-slate-400 hover:text-slate-600">← Tous les rapports</a>
  <div class="flex items-center gap-2">
    <span class="hidden text-xs text-slate-400 sm:inline">{{ slug }} / {{ name }}</span>
    <button onclick="window.print()" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-600 shadow-sm transition hover:bg-slate-50">🖨 Imprimer</button>
  </div>
</div>

<article class="prose prose-slate max-w-none rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8
                prose-h1:text-2xl prose-h1:tracking-tight prose-table:text-sm
                prose-a:font-medium prose-a:text-brand-600 prose-a:no-underline hover:prose-a:underline
                prose-th:bg-slate-50 prose-th:px-3 prose-th:py-2 prose-td:px-3 prose-td:py-2">
  {{ content | safe }}
</article>

{% endblock %}
