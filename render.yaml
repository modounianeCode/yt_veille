# Blueprint Render — déploiement en un clic.
# 1. Pousse ce dépôt sur GitHub.
# 2. Render → New → Blueprint → sélectionne le dépôt.
# 3. Renseigne les variables marquées « sync: false » (DATABASE_URL, YOUTUBE_API_KEY).
#
# Docs : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: yt-veille
    runtime: docker
    plan: free
    region: frankfurt          # même région que Neon (eu-central-1)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Secrets : à renseigner dans le tableau de bord Render
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

      # Base de données : Neon (PostgreSQL) — laisser vide pour SQLite
      - key: FRESHNESS_DAYS
        value: "7"
      - key: SEARCH_ORDER
        value: "relevance"

      # Planificateur intégré (tourne tant que le service est éveillé)
      - key: SCHEDULE_ENABLED
        value: "true"
      - key: SCHEDULE_TIMES
        value: "06:00,18:00"
      - key: SCHEDULE_TIMEZONE
        value: "UTC"

      # Optionnel : cron externe (voir README). Render génère un jeton aléatoire.
      - key: CRON_TOKEN
        generateValue: true
