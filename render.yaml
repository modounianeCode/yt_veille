# Blueprint Render — déploiement en un clic.
# 1. Pousse ce dépôt sur GitHub.
# 2. Render → New → Blueprint → sélectionne le dépôt.
# 3. Renseigne les variables marquées « sync: false » (DATABASE_URL, YOUTUBE_API_KEY).
#
# Docs : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: yt-veille
    runtime: docker
    plan: free
    region: frankfurt          # même région que Neon (eu-central-1)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Secrets : à renseigner dans le tableau de bord Render
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

      # Base de données : Neon (PostgreSQL) — laisser vide pour SQLite
      - key: FRESHNESS_DAYS
        value: "7"
      - key: SEARCH_ORDER
        value: "relevance"

      # Planificateur intégré : DÉSACTIVÉ car le plan gratuit met le service en
      # veille (il ne se réveille donc pas pour sonner). On passe par un cron
      # externe qui appelle /api/cron/collect — l'appel réveille aussi le site.
      # Remettre "true" si tu abandonnes le cron externe.
      - key: SCHEDULE_ENABLED
        value: "false"
      - key: SCHEDULE_TIMES
        value: "06:00,18:00"
      - key: SCHEDULE_TIMEZONE
        value: "UTC"

      # Jeton d'accès au déclenchement externe (voir README).
      # Render génère la valeur : la lire dans le tableau de bord (onglet
      # Environment) puis la coller dans cron-job.org.
      - key: CRON_TOKEN
        generateValue: true
