[project]
name = "yt-veille"
version = "0.1.0"
description = "Veille des meilleures vidéos YouTube par domaine (collecte, scoring, rapports)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
yt-veille = "yt_veille.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yt_veille*"]

[tool.setuptools.package-data]
yt_veille = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
